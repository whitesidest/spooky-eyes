; Spooky Eyes firmware — Waveshare ESP32-S3-DualEye(-Touch)-LCD-1.28
[platformio]
default_envs = dualeye

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -O2
    -fno-math-errno
    -DFW_VERSION=\"0.1.0\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

[env:dualeye]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
build_flags = ${env.build_flags} -DBOARD_DUALEYE_128

; Network upload once the board is on Wi-Fi: pio run -e dualeye_ota -t upload --upload-port spooky-eyes-xxxxxx.local
[env:dualeye_ota]
extends = env:dualeye
upload_protocol = espota

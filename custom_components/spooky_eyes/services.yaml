look:
  target:
    device:
      integration: spooky_eyes
    entity:
      integration: spooky_eyes
  fields:
    x:
      required: true
      example: -0.8
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
          mode: slider
    y:
      required: true
      example: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
          mode: slider
    duration:
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          step: 0.5
          unit_of_measurement: s
action:
  target:
    device:
      integration: spooky_eyes
    entity:
      integration: spooky_eyes
  fields:
    action:
      required: true
      selector:
        select:
          translation_key: action
          options:
            - blink
            - wink_left
            - wink_right
            - look
            - release
            - startle
            - roll
    x:
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
          mode: slider
    y:
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
          mode: slider
    duration:
      selector:
        number:
          min: 0
          max: 3600
          step: 0.5
          unit_of_measurement: s
